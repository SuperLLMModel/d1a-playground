name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # every job only reads the repository

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: lint, type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # the PR label check's sampling and answer rules (src/lib/review.ts; Node 22 strips the types)
      - run: node --test scripts/test_review.mjs
      # the demo examples the UI ships must be the ones scripts/demo-baseline.json pins (scripts/demo_smoke.mjs)
      - run: node scripts/demo_smoke.mjs --list
      - run: npx next typegen && npx tsc --noEmit -p .
      - run: npm run build
      # the Mac mini serves the app under /d1a behind a proxy (mini.sh, D1A_BASE_PATH): that build must work too
      - run: D1A_BASE_PATH=/d1a npm run build

  scripts:
    name: scripts and release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the local-path check diffs a pull request against its base
      - run: python3 scripts/check_hygiene.py pins   # mini.sh, demo.sh and demo.ps1 pin the same D1A
      - name: No local machine path in a pull request's added lines
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: git diff -U0 "origin/$BASE...HEAD" | python3 scripts/check_hygiene.py paths
      - run: bash -n demo.sh && bash -n mini.sh
      - name: demo.ps1 parses (PowerShell)
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path demo.ps1), [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { "demo.ps1:$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
      - run: python3 -m py_compile server/lmstudio_systemone.py server/kev/api.py scripts/pr_outcomes.py
      - run: python3 -m unittest scripts/test_pr_outcomes.py
      - run: python3 -m unittest scripts/test_check_hygiene.py
      - run: python3 scripts/release_notes.py --check "v$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"

  mini-macos:
    name: mini.sh smoke step under macOS bash 3.2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # macOS ships bash 3.2, where `set -u` calls an empty array unbound: mini.sh's smoke step crashed on the Mac mini that
      # way. A copy of mini.sh runs `smoke` against a stand-in web app (a static server answering the model check) with a
      # stand-in demo_smoke.mjs that records its arguments; media on and off must pass the right ones.
      - run: bash scripts/test_mini_smoke.sh
      # a failed install must leave the running services up, and a failure after the stop must start them again: a uv cache
      # owned by root once failed the install after the stop and left the Mac mini down (stand-in uv, npm and launchctl)
      - run: bash scripts/test_mini_update.sh
